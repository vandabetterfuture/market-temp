name: Update market dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update local branch
        run: |
          git pull --rebase origin main

      - name: Generate market data
        run: python scripts/update_market.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/market.json data/history.json

          if git diff --cached --quiet; then
            echo "No market-data changes to commit."
            exit 0
          fi

          git commit -m "Update daily market data"

          git pull --rebase origin main
          git push origin main
