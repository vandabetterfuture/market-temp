name: Update market dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * 1-5"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_market.py
      - run: |
          git config user.name "market-temp-bot"
          git config user.email "market-temp-bot@users.noreply.github.com"
          git add data/market.json data/history.json
          git diff --cached --quiet || git commit -m "Update market report"
          git push
